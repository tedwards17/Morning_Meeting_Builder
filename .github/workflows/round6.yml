name: Round 6 combined batches 2 and 3 hosting checks
on:
  push:
    branches: [Round-6-Development]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: translation-pilot
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
          MYSQL_DATABASE: mmb_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Read and mask generated disposable database credential
        shell: bash
        run: |
          mmb_ci_db_password="$(docker logs '${{ job.services.mysql.id }}' 2>&1 | sed -n 's/^.*GENERATED ROOT PASSWORD: //p' | tail -1)"
          test -n "$mmb_ci_db_password"
          echo "::add-mask::$mmb_ci_db_password"
          printf 'MMB_CI_DB_PASSWORD=%s\n' "$mmb_ci_db_password" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: translation-pilot/package-lock.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, fileinfo, curl, mbstring, gd, exif
          coverage: none
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test && npm run check:php
      - run: python3 scripts/check-migrations.py
      - run: python3 tests/api/history.py && python3 tests/api/translation.py && python3 tests/api/codespaces-origin.py
      - run: npm run build:demo && npm run build:hosted
      - name: Prepare browser
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            printf 'CHROMIUM_PATH=%s\n' "$(command -v google-chrome)" >> "$GITHUB_ENV"
            google-chrome --version
          else
            npx playwright install --with-deps chromium
          fi
      - name: Disposable database and hosted login checks
        env:
          MMB_TEST_ALLOW_RESET: '1'
          MMB_CONFIG: /tmp/mmb-ci.php
          MMB_TRANSLATION_CONFIG: /tmp/mmb-captions-ci.php
        run: |
          mkdir -p /tmp/mmb-ci-media
          cat > /tmp/mmb-ci.php <<'PHP'
          <?php return ['dsn'=>'mysql:host=127.0.0.1;port=3306;dbname=mmb_test;charset=utf8mb4','user'=>'root','password'=>getenv('MMB_CI_DB_PASSWORD'),'media_dir'=>'/tmp/mmb-ci-media','origin'=>'http://127.0.0.1:8081','max_image_bytes'=>15728640,'max_storage_bytes'=>10737418240,'test_http'=>true];
          PHP
          cat > /tmp/mmb-captions-ci.php <<'PHP'
          <?php return ['enabled'=>true,'auth_mode'=>'account','origin'=>'http://127.0.0.1:8081','state_dir'=>'/tmp/mmb-ci-captions','test_http'=>true];
          PHP
          php scripts/migrate.php /tmp/mmb-ci.php
          php scripts/migrate.php /tmp/mmb-ci.php
          MYSQL_PWD="$MMB_CI_DB_PASSWORD" mysql -h127.0.0.1 -uroot mmb_test < database/seed/001_dtb.sql
          php -S 127.0.0.1:8081 -t build/hosted tests/api/router.php > /tmp/mmb-api.log 2>&1 &
          sleep 1
          python3 tests/api/round6-combined.py
          node tests/e2e/round6-combined.cjs
          npm run package
          MMB_PACKAGE_FIXTURE=/tmp/mmb-combined-fixture.json python3 tests/api/package-smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: morning-meeting-builder-round6-combined-hosting
          path: |
            hosting-upload/
            hosting-update/
            translation-pilot/artifacts/morning-meeting-builder-update-0.6.2.zip
